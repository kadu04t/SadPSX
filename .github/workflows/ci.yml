name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SadPSX.slnx

      - name: Build
        run: dotnet build SadPSX.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SadPSX.slnx -c Release --no-build --no-restore
